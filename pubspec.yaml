name: courseflow
description: "CourseFlow connects to Canvas and helps students organize and schedule their assignments."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  collection: ^1.19.1
  flutter:
    sdk: flutter
  flutter_html: ^3.0.0
  http: ^1.6.0
  intl: ^0.20.3
  provider: ^6.1.5+1
  time_range_picker: ^2.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/mock_data/
